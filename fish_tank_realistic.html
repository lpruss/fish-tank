<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Marine Aquarium</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #001a33; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }
        #title {
            color: rgba(200, 230, 255, 0.85);
            font-size: 16px;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0, 50, 100, 0.6);
        }
        #species-label {
            color: rgba(150, 200, 255, 0.5);
            font-size: 11px;
            letter-spacing: 1.5px;
            margin-top: 5px;
        }
        #controls {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
            pointer-events: none;
            z-index: 10;
        }
        .control-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(100, 150, 200, 0.25);
            color: rgba(180, 210, 240, 0.7);
            padding: 6px 14px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 11px;
            font-family: Arial, sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: auto;
        }
        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(220, 240, 255, 0.9);
        }
        #stats {
            position: absolute;
            top: 20px;
            right: 15px;
            color: rgba(150, 180, 220, 0.4);
            font-size: 10px;
            letter-spacing: 1px;
            text-align: right;
            z-index: 10;
        }
        #info-panel {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid rgba(80, 140, 200, 0.3);
            border-radius: 8px;
            padding: 12px 20px;
            color: rgba(200, 230, 255, 0.9);
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.3s;
            max-width: 350px;
            text-align: center;
            backdrop-filter: blur(10px);
        }
        #info-panel.visible { opacity: 1; }
        #info-panel .fish-name { font-size: 14px; font-weight: 500; margin-bottom: 4px; color: rgba(220, 240, 255, 0.95); }
        #info-panel .fish-detail { color: rgba(150, 200, 255, 0.6); font-size: 11px; }
    </style>
</head>
<body>
    <div id="ui">
        <div id="title">Marine Aquarium</div>
        <div id="species-label">Hover over fish to identify species</div>
    </div>
    <div id="stats">
        <div>Species: 8</div>
        <div id="fish-count">Fish: 40</div>
        <div id="fps-counter">60 FPS</div>
    </div>
    <div id="info-panel">
        <div class="fish-name"></div>
        <div class="fish-detail"></div>
    </div>
    <div id="controls">
        <button class="control-btn" onclick="timeScale = 0.5">Slow</button>
        <button class="control-btn" onclick="timeScale = 1.0">Normal</button>
        <button class="control-btn" onclick="timeScale = 2.0">Fast</button>
        <button class="control-btn" onclick="paused = !paused">Pause</button>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let time = 0;
        let timeScale = 1.0;
        let paused = false;
        let fps = 0, lastTime = 0;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        const SPECIES = [
            { name: 'Clownfish', latin: 'Amphiprion ocellaris', color: '#ff6414', stripe: '#ffffff', size: 0.75, speed: 0.8, pattern: 'clown' },
            { name: 'Blue Tang', latin: 'Paracanthurus hepatus', color: '#1446dc', stripe: '#0a1eb4', size: 1.0, speed: 1.2, pattern: 'band' },
            { name: 'Angelfish', latin: 'Pomacanthus imperator', color: '#dcc832', stripe: '#ffb41e', size: 1.2, speed: 0.6, pattern: 'stripes' },
            { name: 'Neon Guppy', latin: 'Poecilia reticulata', color: '#00c8ff', stripe: '#ff3250', size: 0.4, speed: 1.5, pattern: 'stripe' },
            { name: 'Mollies', latin: 'Poecilia sphenops', color: '#ff328c', stripe: '#ffc864', size: 0.5, speed: 1.3, pattern: 'guppy' },
            { name: 'Parrotfish', latin: 'Scarus vetula', color: '#ff3c50', stripe: '#ff961e', size: 1.1, speed: 0.7, pattern: 'parrot' },
            { name: 'Damsel', latin: 'Pomacentridae', color: '#1e1e50', stripe: '#6478c8', size: 0.5, speed: 1.0, pattern: 'damsel' },
            { name: 'Mandarin', latin: 'Synchiropus splendidus', color: '#00b464', stripe: '#ff6432', size: 0.6, speed: 0.5, pattern: 'mandarin' }
        ];

        class Fish {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height * 0.6 + height * 0.15;
                this.species = SPECIES[Math.floor(Math.random() * SPECIES.length)];
                this.angle = Math.random() * Math.PI * 2;
                this.speed = (0.3 + Math.random() * 0.7) * this.species.speed;
                this.tailPhase = Math.random() * Math.PI * 2;
                this.size = this.species.size * (0.7 + Math.random() * 0.6);
                this.bobPhase = Math.random() * Math.PI * 2;
                this.bobAmount = 0.5 + Math.random() * 1.5;
            }

            update(delta, t) {
                this.x += Math.cos(this.angle) * this.speed * delta * 60;
                this.y += Math.sin(this.angle * 0.5) * this.speed * delta * 30 + Math.sin(t * 2 + this.bobPhase) * this.bobAmount * delta * 10;
                
                if (this.x > width + 50) this.x = -50;
                if (this.x < -50) this.x = width + 50;
                if (this.y > height * 0.85) this.angle = -Math.abs(this.angle) * 0.8;
                if (this.y < height * 0.15) this.angle = Math.abs(this.angle) * 0.8;

                this.draw(t);
            }

            draw(t) {
                const tailWag = Math.sin(t * 12 + this.tailPhase) * 0.4;
                const s = this.size;
                const bodyColor = this.species.color;
                const stripeColor = this.species.stripe;

                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Body
                ctx.fillStyle = bodyColor;
                ctx.beginPath();
                ctx.ellipse(0, 0, 15 * s, 8 * s, 0, 0, Math.PI * 2);
                ctx.fill();

                // Head
                ctx.beginPath();
                ctx.ellipse(12 * s, 0, 6 * s, 7 * s, 0, 0, Math.PI * 2);
                ctx.fill();

                // Tail fin
                ctx.fillStyle = stripeColor;
                ctx.beginPath();
                ctx.moveTo(-12 * s, 0);
                ctx.lineTo(-22 * s, -8 * s + tailWag * 12 * s);
                ctx.lineTo(-22 * s, 8 * s + tailWag * 12 * s);
                ctx.closePath();
                ctx.fill();

                // Dorsal fin
                ctx.beginPath();
                ctx.moveTo(-2 * s, -8 * s);
                ctx.lineTo(5 * s, -15 * s);
                ctx.lineTo(10 * s, -8 * s);
                ctx.closePath();
                ctx.fill();

                // Pectoral fin
                ctx.beginPath();
                ctx.ellipse(5 * s, 5 * s, 4 * s, 2 * s, Math.PI * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Eyes
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(14 * s, -2 * s, 2.5 * s, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#000000';
                ctx.beginPath();
                ctx.arc(14.5 * s, -2 * s, 1.5 * s, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            isHovered(mx, my) {
                const dx = mx - this.x;
                const dy = my - this.y;
                return Math.sqrt(dx * dx + dy * dy) < 30 * this.size;
            }
        }

        class Bubble {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + 10;
                this.size = 1 + Math.random() * 4;
                this.speed = 0.3 + Math.random() * 0.7;
                this.wobblePhase = Math.random() * Math.PI * 2;
                this.opacity = 0.2 + Math.random() * 0.3;
            }

            update(delta, t) {
                this.y -= this.speed * delta * 60;
                this.x += Math.sin(t * 3 + this.wobblePhase) * 0.3;
                
                if (this.y < -10) this.reset();
                this.draw();
            }

            draw() {
                ctx.strokeStyle = `rgba(200, 230, 255, ${this.opacity})`;
                ctx.lineWidth = 0.5;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.stroke();
            }
        }

        const fishes = Array.from({ length: 40 }, () => new Fish());
        const bubbles = Array.from({ length: 80 }, () => new Bubble());

        function drawBackground() {
            // Water gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#001a33');
            gradient.addColorStop(0.5, '#003366');
            gradient.addColorStop(1, '#002244');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // Light rays
            ctx.globalAlpha = 0.03;
            ctx.fillStyle = '#88bbff';
            for (let i = 0; i < 5; i++) {
                const x = width * 0.2 + i * width * 0.15;
                const sway = Math.sin(time * 0.3 + i) * 20;
                ctx.beginPath();
                ctx.moveTo(x + sway, 0);
                ctx.lineTo(x - 30 + sway, height);
                ctx.lineTo(x + 30 + sway, height);
                ctx.closePath();
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawSand() {
            ctx.fillStyle = '#c4a45a';
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 20) {
                const h = Math.sin(x * 0.01) * 10 + Math.cos(x * 0.005) * 5;
                ctx.lineTo(x, height - 40 + h);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            // Seaweed
            ctx.fillStyle = '#2a6630';
            for (let i = 0; i < 8; i++) {
                const x = width * 0.1 + i * width * 0.12;
                const sway = Math.sin(time * 2 + i) * 8;
                ctx.beginPath();
                ctx.moveTo(x, height - 40);
                ctx.quadraticCurveTo(x + sway, height - 80, x + sway * 1.5, height - 120);
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#2a6630';
                ctx.stroke();
            }
        }

        let hoveredFish = null;
        let infoPanelTimer = null;

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            hoveredFish = null;
            for (const fish of fishes) {
                if (fish.isHovered(mx, my)) {
                    hoveredFish = fish;
                    break;
                }
            }

            const infoPanel = document.getElementById('info-panel');
            if (hoveredFish) {
                const sp = hoveredFish.species;
                infoPanel.querySelector('.fish-name').textContent = sp.name;
                infoPanel.querySelector('.fish-detail').textContent = sp.latin + ' — ' + sp.detail;
                infoPanel.classList.add('visible');
                document.getElementById('species-label').textContent = 'Species: ' + sp.name;
                clearTimeout(infoPanelTimer);
                infoPanelTimer = setTimeout(() => { infoPanel.classList.remove('visible'); }, 3000);
            } else {
                infoPanel.classList.remove('visible');
                document.getElementById('species-label').textContent = 'Hover over fish to identify species';
            }
        });

        function animate(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = Math.min((timestamp - lastTime) / 1000, 0.1);
            lastTime = timestamp;

            if (!paused) {
                time += delta * timeScale;
                fishes.forEach(fish => fish.update(delta, time));
                bubbles.forEach(bubble => bubble.update(delta, time));
            }

            drawBackground();
            drawSand();

            fps++;
            if (time - lastTime > 1000) {
                document.getElementById('fps-counter').textContent = fps + ' FPS';
                fps = 0;
            }

            requestAnimationFrame(animate);
        }

        animate(0);
    </script>
</body>
</html>
