<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Marine Aquarium</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #001a33; font-family: Arial, sans-serif; }
#canvas { display: block; width: 100vw; height: 100vh; position: fixed; top: 0; left: 0; }
#ui { position: fixed; top: 20px; left: 0; width: 100%; text-align: center; pointer-events: none; z-index: 10; }
#title { color: rgba(200, 230, 255, 0.85); font-size: 16px; font-weight: 300; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0, 50, 100, 0.6); }
#species-label { color: rgba(150, 200, 255, 0.5); font-size: 11px; letter-spacing: 1.5px; margin-top: 5px; }
#controls { position: fixed; bottom: 15px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; pointer-events: none; z-index: 10; }
.control-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(100, 150, 200, 0.25); color: rgba(180, 210, 240, 0.7); padding: 6px 14px; border-radius: 15px; cursor: pointer; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; pointer-events: auto; }
.control-btn:hover { background: rgba(255, 255, 255, 0.12); color: rgba(220, 240, 255, 0.9); }
#stats { position: fixed; top: 20px; right: 15px; color: rgba(150, 180, 220, 0.4); font-size: 10px; letter-spacing: 1px; text-align: right; z-index: 10; }
#debug { position: fixed; bottom: 50px; left: 10px; color: lime; font-size: 10px; font-family: monospace; z-index: 10; pointer-events: none; }
</style>
</head>
<body>
<div id="debug">Initializing...</div>
<canvas id="canvas"></canvas>
<div id="ui">
    <div id="title">Marine Aquarium</div>
    <div id="species-label">Hover over fish to identify species</div>
</div>
<div id="stats">
    <div>Species: 8</div>
    <div id="fish-count">Fish: 40</div>
    <div id="fps-counter">60 FPS</div>
</div>
<div id="controls">
    <button class="control-btn" onclick="timeScale = 0.5">Slow</button>
    <button class="control-btn" onclick="timeScale = 1.0">Normal</button>
    <button class="control-btn" onclick="timeScale = 2.0">Fast</button>
    <button class="control-btn" onclick="paused = !paused">Pause</button>
</div>

<script>
var debug = document.getElementById('debug');
var log = function(msg) { debug.textContent = msg; console.log(msg); };

var canvas, ctx, width, height;
var time = 0, timeScale = 1.0, paused = false;
var fps = 0, lastTime = 0;
var fishes = [];

log('Step 1: Looking for canvas...');
canvas = document.getElementById('canvas');
if (!canvas) { log('ERROR: Canvas not found'); throw new Error('Canvas not found'); }
log('Step 2: Got canvas, getting context...');

ctx = canvas.getContext('2d');
if (!ctx) { log('ERROR: Canvas 2D context not available'); throw new Error('No 2D context'); }
log('Step 3: Context obtained, setting size...');

width = canvas.width = window.innerWidth;
height = canvas.height = window.innerHeight;
log('Step 4: Canvas sized to ' + width + 'x' + height);

// Simple test fish
for (var i = 0; i < 5; i++) {
    fishes.push({
        x: Math.random() * width,
        y: Math.random() * height,
        color: ['#ff6414', '#1446dc', '#dcc832', '#00c8ff', '#ff328c'][i]
    });
}

log('Step 5: Starting animation...');

function draw() {
    ctx.fillStyle = '#001a33';
    ctx.fillRect(0, 0, width, height);
    
    for (var i = 0; i < fishes.length; i++) {
        fishes[i].x += (Math.random() - 0.5) * 2;
        fishes[i].y += (Math.random() - 0.5) * 2;
        
        ctx.fillStyle = fishes[i].color;
        ctx.beginPath();
        ctx.ellipse(fishes[i].x, fishes[i].y, 15, 10, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    
    fps++;
    requestAnimationFrame(draw);
}

draw();
log('Step 6: Animation started - should see colored ellipses moving');

window.addEventListener('resize', function() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    log('Resized to ' + width + 'x' + height);
});
</script>
</body>
</html>
